<!DOCTYPE html>
<html lang="en">
<head>
 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CyberShield</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game-container">

    <!-- Start Screen -->
    <section id="start-screen" class="screen">
      <h1>CyberShield</h1>
      <h2>Incident Response Simulator</h2>

      <p id="game-description">
        Respond to cybersecurity incidents and protect the company.
      </p>

      <h3>Select Difficulty</h3>

      <div class="difficulty-buttons">
        <button id="easy-btn" class="difficulty-btn">
          Easy
        </button>

        <button id="medium-btn" class="difficulty-btn">
          Medium
        </button>

        <button id="hard-btn" class="difficulty-btn">
          Hard
        </button>
      </div>
    </section>

    <!-- Game Screen -->
    <section id="game-screen" class="screen hidden">

      <header class="game-header">
        <p id="incident-number">
          Security Incident 1 of 20
        </p>

        <p id="score-display">
          Score: 0
        </p>

        <p id="timer-display">
          Time: 20
        </p>
      </header>

      <div class="incident-card">
        <p id="priority-display">
          Priority: High
        </p>

        <h2 id="incident-question">
          Incident question will appear here.
        </h2>

        <div id="answer-container">
          <button class="answer-btn">Answer 1</button>
          <button class="answer-btn">Answer 2</button>
          <button class="answer-btn">Answer 3</button>
          <button class="answer-btn">Answer 4</button>
        </div>

        <p id="feedback-message"></p>

        <button id="next-btn" class="hidden">
          Next Incident
        </button>
      </div>

    </section>

    <!-- End Screen -->
    <section id="end-screen" class="screen hidden">
      <h2 id="final-message">
        Mission Successful!
      </h2>

      <p id="final-score">
        Final Score: 14 out of 20
      </p>

      <button id="restart-btn">
        Restart Game
      </button>
    </section>

  </main>

   <script src="data.js"></script>
<script src="app.js"></script>

  </script>
</body>
</html>
