<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CyberShield</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Orbitron:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game-container">

    <!-- Start Screen -->
    <section id="start-screen" class="screen">

      <h1>CyberShield</h1>

      <h2>Incident Response Simulator</h2>

      <p id="game-description">
        Respond to cybersecurity incidents and protect the company.
      </p>

      <h3>Select Difficulty</h3>

      <div class="difficulty-buttons">

        <button
          id="easy-btn"
          class="difficulty-btn"
          type="button"
        >
          Easy
        </button>

        <button
          id="medium-btn"
          class="difficulty-btn"
          type="button"
        >
          Medium
        </button>

        <button
          id="hard-btn"
          class="difficulty-btn"
          type="button"
        >
          Hard
        </button>

      </div>

    </section>

    <!-- Game Screen -->
    <section id="game-screen" class="screen hidden">

      <header class="game-header">

        <p id="incident-number">
          Security Incident 1 of 20
        </p>

        <p id="score-display">
          Score: 0
        </p>

        <p id="timer-display">
          Time: 20
        </p>

      </header>

      <div class="incident-card">

        <p id="priority-display">
          Priority: High
        </p>

        <h2 id="incident-question">
          Incident question will appear here.
        </h2>

        <div id="answer-container">

          <button
            class="answer-btn"
            type="button"
          >
            Answer 1
          </button>

          <button
            class="answer-btn"
            type="button"
          >
            Answer 2
          </button>

          <button
            class="answer-btn"
            type="button"
          >
            Answer 3
          </button>

          <button
            class="answer-btn"
            type="button"
          >
            Answer 4
          </button>

        </div>

        <p id="feedback-message"></p>

        <button
          id="next-btn"
          class="hidden"
          type="button"
        >
          Next Incident
        </button>

      </div>

    </section>

    <!-- End Screen -->
    <section id="end-screen" class="screen hidden">

      <h2 id="final-message">
        Mission Successful!
      </h2>

      <p id="final-score">
        Final Score: 0 out of 20
      </p>

      <button
        id="restart-btn"
        type="button"
      >
        Restart Game
      </button>

    </section>

  </main>

  <!-- EasyTimer library -->
  <script src="https://cdn.jsdelivr.net/npm/easytimer.js@4.6.0/dist/easytimer.min.js"></script>

  <!-- Incident data -->
  <script src="data.js"></script>

  <!-- Main JavaScript -->
  <script src="app.js"></script>

</body>
</html>
